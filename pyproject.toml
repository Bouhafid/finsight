[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "Evidence-grounded answers on SEC 10-K filings: XBRL figures, pgvector retrieval, quote-verified LLM claims."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ingest = ["beautifulsoup4>=4.12", "lxml>=5.0", "requests>=2.32"]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finsight = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
